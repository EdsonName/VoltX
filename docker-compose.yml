services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: volx-php:latest
    container_name: volx-php
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/apache-config.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DB=volx_db
      - MYSQL_USER=volx_user
      - MYSQL_PASSWORD=volx_password
    depends_on:
      - mysql
    networks:
      - volx-network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: volx_db
      MYSQL_USER: volx_user
      MYSQL_PASSWORD: volx_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - volx-network
    container_name: volx-mysql

volumes:
  mysql_data:
    driver: local

networks:
  volx-network:
    driver: bridge
